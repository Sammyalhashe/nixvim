name: Update Flake

on:
  schedule:
    - cron: "30 00 * * 1"
  workflow_dispatch: # Allow manual triggering

permissions: read-all

jobs:
  # Run `nix flake update` and open (or refresh) a PR if anything changed.
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.update.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - id: update
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          pr-title: "deps: update flake.lock"
          commit-msg: "[flake] nix flake update"

  # PRs opened with GITHUB_TOKEN don't trigger ci.yml, so validate here.
  check:
    needs: update
    if: needs.update.outputs.pr != ''
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: update_flake_lock_action
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix flake check -L

  # Only reached when every check passed; a failure leaves the PR open.
  merge:
    needs: [update, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge "${{ needs.update.outputs.pr }}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
